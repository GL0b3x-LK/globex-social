<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>{{ font_face_css|safe }}</style>
  {# The closing frame of every video. Rendered from HTML rather than generated,
     so the logo and brand colours are exact — the same rule the post templates
     follow. The client asked for the top lockup plus the founding line. #}
  <style>
    :root { --navy: #002D70; --cyan: #5BC0DE; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      font-family: 'Poppins', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--navy);
      color: #fff;
    }
    .frame {
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 54px;
    }
    .logo { width: 62%; max-width: 700px; }
    .rule { width: 168px; height: 7px; background: var(--cyan); border-radius: 4px; }
    .tag {
      font-size: 46px; font-weight: 500; letter-spacing: 0.4px;
      color: rgba(255,255,255,0.92); text-align: center;
    }
  </style>
</head>
<body>
  <div class="frame">
    {% if logos.lockup_side_white %}
      <img class="logo" src="{{ logos.lockup_side_white }}" alt="">
    {% endif %}
    <div class="rule"></div>
    <div class="tag">{{ tagline }}</div>
  </div>
</body>
</html>
