# Tooling config only. Dependencies live in requirements*.txt (Railway-friendly).
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "scripts/*.tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]  # long URLs / prompt strings; formatter handles wrapping

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
files = ["app", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
